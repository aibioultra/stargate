<title>STARGATE 리크루트 라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: STARGATE 셸 — 위쪽 우주 띠에 7개 게이트가 궤도로 이어지고, 게이트를 누르면 아래 패널에 그 게이트의 일이 열린다.
   오른쪽에는 크루 탑승권(지원자번호·STAR 유형·별빛 포인트·휘장)이 따라다닌다. 브랜드는 ULTRA ANCHOR 네이비·시안과 Archivo 이탤릭. */
:root{
  --ink-deep:#0B1030; --navy:#1B2452; --navy-deep:#141B42; --navy-up:#2E4CA8; --blue:#1F5CC4; --cyan:#27B9CF; --cyan-soft:#BFEFF6; --amber:#E59A2F; --amber-soft:#FFD27A;
  --on-dark:#EEF3FF; --on-dark-muted:#A9B5D6; --on-dark-line:rgba(255,255,255,.14);
  --gg-hi:#7DB0FF; --cn-hi:#4FD8EA; --dg-hi:#F3AE52;
  --paper:#F5F8FD; --panel:#FFFFFF; --ink:#121838; --muted:#586487; --rule:#DCE4F1; --soft:#EAF1FB;
  --main:#1F5CC4; --main-tint:rgba(31,92,196,.10);
  --btn:#1B2452; --btn-ink:#FFFFFF; --btn-hover:#1F5CC4;
  --ok:#0A7D90; --ok-tint:rgba(39,185,207,.15);
  --warn:#9E5C08; --warn-tint:rgba(229,154,47,.16);
  --lock:#9AA6C2;
  --gg:#2F6FD6; --cn:#0A8FA4; --dg:#C26F16;
  --scrim:rgba(8,12,34,.62);
  --f-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A0F2A; --panel:#121A3D; --ink:#E9EEFF; --muted:#A3AED0; --rule:#26315E; --soft:#1A2450;
    --main:#86B6FF; --main-tint:rgba(134,182,255,.14);
    --btn:#27B9CF; --btn-ink:#0B1030; --btn-hover:#4FD8EA;
    --ok:#4FD8EA; --ok-tint:rgba(79,216,234,.14);
    --warn:#F3B864; --warn-tint:rgba(243,184,100,.15);
    --lock:#56618A; --gg:#7DB0FF; --cn:#4FD8EA; --dg:#F3AE52; --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A0F2A; --panel:#121A3D; --ink:#E9EEFF; --muted:#A3AED0; --rule:#26315E; --soft:#1A2450;
  --main:#86B6FF; --main-tint:rgba(134,182,255,.14);
  --btn:#27B9CF; --btn-ink:#0B1030; --btn-hover:#4FD8EA;
  --ok:#4FD8EA; --ok-tint:rgba(79,216,234,.14);
  --warn:#F3B864; --warn-tint:rgba(243,184,100,.15);
  --lock:#56618A; --gg:#7DB0FF; --cn:#4FD8EA; --dg:#F3AE52; --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.disp{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:115%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 상단(우주 띠) ───────────────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(11,16,48,.97);color:var(--on-dark);border-bottom:1px solid var(--on-dark-line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px 12px;padding-block:9px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:34px;width:auto;display:block;flex:none}
.brand-t{display:grid;line-height:1.15;border-left:1px solid var(--on-dark-line);padding-left:12px;min-width:0}
.brand-t strong{font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:120%;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand-t strong em{font-style:inherit;color:var(--cyan)}
.brand-t span{font-size:12px;color:var(--on-dark-muted)}
.dchip,.xpchip{display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.dchip{background:rgba(39,185,207,.13);color:var(--cyan-soft);border:1px solid rgba(39,185,207,.38)}
.dchip b,.xpchip b{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;font-size:14.5px;color:#fff}
.xpchip{background:rgba(229,154,47,.14);color:var(--amber-soft);border:1px solid rgba(229,154,47,.4);align-items:center}
.xpchip svg{width:13px;height:13px;fill:var(--amber);flex:none}
.xpchip.bump{animation:bump .7s ease}
@keyframes bump{30%{transform:scale(1.12);box-shadow:0 0 18px rgba(229,154,47,.7)}}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--on-dark-line);background:transparent;color:var(--on-dark);border-radius:999px;padding:4px 12px 4px 5px;font-size:12.5px}
.switch .knob{width:30px;height:18px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-pressed="true"] .knob{background:var(--amber)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(12px)}
@media (max-width:560px){.brand img{height:28px}.brand-t span{display:none}.brand-t strong{font-size:13.5px}.xpchip{display:none}}
.ribbon{background:var(--amber);color:#2A1700;font-size:13px;font-weight:500}
.ribbon .gut{max-width:1180px;margin:0 auto;padding-block:6px}

.space{position:relative;overflow:hidden;color:var(--on-dark);background:
  radial-gradient(60% 160% at 88% -30%, rgba(46,76,168,.85) 0%, transparent 60%),
  radial-gradient(40% 120% at 8% 130%, rgba(39,185,207,.22) 0%, transparent 60%),
  linear-gradient(180deg,#0E1438 0%, var(--ink-deep) 100%)}
.stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stars circle{fill:#fff;animation:tw 4s ease-in-out infinite}
.stars circle.c{fill:var(--cyan-soft)}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.95}}

/* ── 게이트 궤도 ─────────────────── */
.line{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(169,181,214,.4) transparent}
.line-in{position:relative;max-width:1180px;min-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:16px 8px 14px}
.rail,.fill{position:absolute;top:55px;height:4px;border-radius:2px}
.rail{left:calc(8px + (100% - 16px)/14);right:calc(8px + (100% - 16px)/14);background:repeating-linear-gradient(90deg,rgba(191,239,246,.5) 0 3px,transparent 3px 11px)}
.fill{left:calc(8px + (100% - 16px)/14);background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 14px rgba(39,185,207,.75);transition:width .6s ease}
.st{position:relative;display:grid;justify-items:center;gap:6px;background:none;border:0;padding:0 4px 8px;border-radius:14px;text-align:center;color:var(--on-dark)}
.st .due{font-family:var(--f-mono);font-size:11px;color:var(--on-dark-muted);height:16px;line-height:16px;white-space:nowrap;letter-spacing:.03em}
.st .dot{position:relative;width:38px;height:38px;border-radius:50%;background:var(--navy-deep);border:2px solid rgba(169,181,214,.5);display:grid;place-items:center;z-index:1;font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;font-size:13px;color:var(--on-dark-muted)}
.st .dot::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed rgba(169,181,214,.4)}
.st .dot svg{font-size:16px}
.st .lbl{display:grid;line-height:1.25;gap:1px}
.st .code{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:10.5px;color:var(--cyan-soft);letter-spacing:.12em;opacity:.85;white-space:nowrap}
.st .name{font-weight:700;font-size:14px}
.st.done .dot{background:var(--cyan);border-color:var(--cyan);color:var(--ink-deep);box-shadow:0 0 16px rgba(39,185,207,.7)}
.st.done .dot::before{border-color:rgba(11,16,48,.3)}
.st.now .dot{border-color:var(--cyan);color:#fff;box-shadow:0 0 0 5px rgba(39,185,207,.16),0 0 20px rgba(39,185,207,.5)}
.st.now .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cyan);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.st.open .dot{border-color:rgba(39,185,207,.85);color:#fff}
.st.lock .dot,.st.lock .lbl{opacity:.55}
.st.sel{background:rgba(255,255,255,.07)}
.st.sel .name{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--cyan)}
.st:hover .name{color:var(--cyan-soft)}

/* ── 본문 ───────────────────────── */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;padding-block:26px 64px}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0;display:grid;gap:22px}
.ph{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:center}
.gbadge{grid-row:span 2;position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 32% 26%, var(--navy-up), var(--navy) 58%, var(--ink-deep));font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:120%;font-size:20px;box-shadow:0 12px 26px -14px rgba(27,36,82,.8)}
.gbadge::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(39,185,207,.85);animation:spin 22s linear infinite}
.gbadge::after{content:"";position:absolute;top:2px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-t{display:grid;gap:0;min-width:0}
.kick{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:12px;letter-spacing:.14em;color:var(--main);text-transform:uppercase}
.ph h1{margin:0;font-size:27px;line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
.ph .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.lead{margin:0;max-width:68ch;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12.5px;line-height:1.6;background:var(--panel);white-space:nowrap}
.chip.ok{border-color:transparent;background:var(--ok-tint);color:var(--ok);font-weight:600}
.chip.now{border-color:transparent;background:var(--main-tint);color:var(--main);font-weight:600}
.chip.lock{color:var(--muted)}
.chip.warn{border-color:transparent;background:var(--warn-tint);color:var(--warn)}
.chip.star{border-color:transparent;background:var(--ink-deep);color:var(--cyan-soft);font-weight:600}
.chip.star svg{width:11px;height:11px;fill:var(--amber)}
.chip .ld{width:9px;height:9px;border-radius:50%;background:var(--c,var(--main))}
.sec{display:grid;gap:12px}
.sec>h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sec>h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.note{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:13.5px;margin:0;padding:8px 12px;border-radius:10px}
.msg.ok{background:var(--ok-tint);color:var(--ok)}
.msg.warn{background:var(--warn-tint);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:10px 18px;font-size:14.5px;transition:background .15s,box-shadow .15s}
.btn:hover{background:var(--btn-hover);box-shadow:0 6px 18px -8px rgba(31,92,196,.6)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:600}
.btn.ghost:hover{border-color:var(--main);color:var(--main);box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--main);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* 입력 */
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;font-weight:700}
.f>span em{font-style:normal;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:9px 11px;font-size:14.5px;line-height:1.55}
.f textarea{resize:vertical;min-height:84px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px var(--main-tint)}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);justify-self:end}
.cnt.ok{color:var(--ok)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px;width:17px;height:17px;accent-color:var(--blue);flex:none}

/* 탑승(첫 화면) */
.hero{position:relative;overflow:hidden;border-radius:24px;color:var(--on-dark);background:linear-gradient(180deg,var(--navy) 0%,var(--ink-deep) 100%);box-shadow:0 30px 60px -36px rgba(27,36,82,.9)}
.hero-img{position:relative;aspect-ratio:2/1;overflow:hidden;background:#9FC3EC}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.hero-img::after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(180deg,rgba(11,16,48,0) 0%,rgba(27,36,82,.9) 88%,var(--navy) 100%)}
.hero-tag{position:absolute;left:16px;top:14px;z-index:1;font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:11px;letter-spacing:.14em;background:rgba(11,16,48,.72);color:var(--cyan-soft);border:1px solid rgba(191,239,246,.35);border-radius:999px;padding:4px 11px;backdrop-filter:blur(4px)}
.hero-t{position:relative;padding:4px 28px 28px;margin-top:-34px;display:grid;gap:0}
.hero-k{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:12px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;margin:0}
.hero h1{margin:6px 0 10px;font-size:clamp(25px,3.4vw,34px);line-height:1.22;letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero p{margin:0;color:var(--on-dark-muted);max-width:60ch}
.hero-cta{margin-top:16px}
.btn.cta{background:var(--cyan);color:var(--ink-deep)}
.btn.cta:hover{background:#4FD8EA}
.btn.ghost-d{background:transparent;color:var(--on-dark);border:1px solid var(--on-dark-line);font-weight:600}
.btn.ghost-d:hover{border-color:var(--cyan);color:var(--cyan-soft);background:transparent;box-shadow:none}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .meta span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;border:1px solid var(--on-dark-line);border-radius:999px;padding:3px 10px;color:var(--cyan-soft)}
@media (max-width:700px){.hero-img{aspect-ratio:16/10}.hero-img img{object-position:50% 45%}.hero-t{padding:0 18px 22px;margin-top:-24px}}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.perks{grid-template-columns:minmax(0,1fr)}}
.perk{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.perk b{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:115%;font-size:12px;letter-spacing:.1em;color:var(--main);text-transform:uppercase}
.perk span{font-size:13.5px}
.gates{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gates li{display:grid}
.gates .gi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
button.gi{cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.gi:hover{border-color:var(--main);box-shadow:0 8px 20px -14px rgba(31,92,196,.8)}
.gi .gs{grid-column:2;justify-self:start;margin-top:4px}
.gi.done .gn{background:var(--cyan);color:var(--ink-deep);box-shadow:0 0 12px -2px var(--cyan)}
.gi.now{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box}
.gi.lock{opacity:.7}
.gates .gn{grid-row:span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink-deep);color:var(--cyan);font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:118%;font-size:13px;box-shadow:inset 0 0 0 2px rgba(39,185,207,.5)}
.gates b{font-size:14.5px}
.gates b small{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:115%;font-size:10.5px;letter-spacing:.12em;color:var(--main);margin-left:6px}
.gates span{font-size:13px;color:var(--muted);line-height:1.45}

/* 지역 GATE */
.branch{display:grid;gap:10px}
.branch-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lname{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.lname small{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:11px;letter-spacing:.14em;color:var(--c)}
.cst{margin-left:auto;width:132px;height:58px;border-radius:10px;background:var(--ink-deep);flex:none}
.cst .arc{fill:none;stroke:rgba(169,181,214,.35);stroke-width:4;stroke-linecap:round}
.cst .arc.on{stroke:var(--c-hi);filter:drop-shadow(0 0 3px var(--c-hi))}
.cst .core{fill:rgba(255,255,255,.06)}
.cst.lit .core{fill:var(--c-hi);opacity:.85;filter:drop-shadow(0 0 6px var(--c-hi))}
.cst text{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:115%;font-size:9px;fill:var(--on-dark-muted);letter-spacing:.08em}
.cst text.st{font-size:12px;fill:#fff}
.cst.lit text.st{fill:var(--c-hi)}
.cst.lit{box-shadow:0 0 0 1px var(--c-hi),0 0 18px -4px var(--c-hi)}
.track{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 8px}
.stop{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:6px 8px;min-width:120px;text-align:center;border-radius:12px;flex:0 0 auto}
@media (max-width:520px){.stop{flex:1 1 0;min-width:0;padding:6px 2px}.stop .sl{font-size:12.5px}.seg{flex:0 0 12px;min-width:12px}}
.stop .sd{width:28px;height:28px;display:grid;place-items:center}
.stop .sd svg{width:28px;height:28px;fill:none;stroke:var(--c);stroke-width:1.6;transition:transform .3s}
.stop.done .sd svg{fill:var(--c);stroke:var(--c);filter:drop-shadow(0 0 5px var(--c));transform:scale(1.08)}
.stop.sel{background:var(--soft)}
.stop:hover .sd svg{transform:scale(1.1)}
.stop .sl{font-size:13px;font-weight:700;line-height:1.3}
.stop .sk{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{flex:1 1 24px;min-width:24px;height:2px;background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 9px);margin:19px -8px 0;opacity:.7}
.term{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.coc{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--rule);border-radius:8px;padding:3px 9px;font-weight:700;font-size:13px;color:var(--muted)}
.coc.on{border-style:solid;border-color:var(--c);color:var(--ink);box-shadow:0 0 12px -6px var(--c)}
.editor{border-left:3px solid var(--c,var(--main));padding:4px 0 4px 16px;display:grid;gap:12px}
.vid{width:100%;max-width:640px;aspect-ratio:16/9;border-radius:12px;background:#0B1030;display:block;box-shadow:0 14px 30px -20px rgba(11,16,48,.9)}
.vidnote{font-size:12.5px;color:var(--muted);margin:-4px 0 0}

/* 공고 */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{border:2px dashed var(--rule);border-radius:var(--r);padding:10px 14px;min-height:66px;display:grid;align-content:center;gap:2px;font-size:13px}
.slot.on{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box}
.slot .sn{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:11px;color:var(--main);letter-spacing:.12em}
.slot strong{font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fbtn[aria-pressed="true"]{border-color:var(--ink-deep);background:var(--ink-deep);color:#fff}
.fbtn .ld{width:9px;height:9px;border-radius:50%;background:var(--c)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.job{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;position:relative}
.job.applied{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box;box-shadow:0 10px 28px -18px rgba(31,92,196,.7)}
.job.locked{background:transparent}
.job-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.job h3{margin:0;font-size:17px;line-height:1.35}
.job .co{font-weight:700}
.job .meta{display:flex;flex-wrap:wrap;gap:6px}
.job .lockmsg{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin:0}
.jd{border-top:1px solid var(--rule);padding-top:10px;display:grid;gap:10px;font-size:14px}
.jd h4{margin:0;font-size:13px;color:var(--muted);font-weight:700}
.jd ul{margin:0;padding-left:18px}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.flow span{background:var(--soft);border-radius:6px;padding:1px 7px}

/* 서류 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cyan)}
.tab .tick{color:var(--ok)}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.exp{grid-template-columns:minmax(0,1fr)}}
.exp .box{display:grid;gap:8px;padding:12px}
.exp .en{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:12px;letter-spacing:.1em;color:var(--main)}
.q{display:grid;gap:8px}
.q .qt{font-weight:700}
.q .qs{font-size:12.5px;color:var(--muted)}
.peek{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px}
.peek p{margin:4px 0 0}

/* 직무 미션 */
.case{display:grid;gap:14px}
.scn{background:var(--soft);border-radius:10px;padding:12px 14px;border-left:3px solid var(--cyan)}
.scn p{margin:0 0 6px}
.scn p:last-child{margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13.5px;min-width:360px}
.tbl th,.tbl td{border:1px solid var(--rule);padding:6px 10px;text-align:left}
.tbl th{background:var(--panel);font-weight:700}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--panel);font-size:14px}
.opt input{margin-top:4px;accent-color:var(--blue);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--warn);background:var(--warn-tint)}
.expl{font-size:13.5px;border-left:3px solid var(--ok);padding-left:10px;margin:0}
.timer{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;font-size:30px;min-width:84px}

/* 지원 카드 */
.acard{border-radius:16px;overflow:hidden;max-width:560px;border:1px solid var(--rule);background:var(--panel)}
.acard-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(110deg,var(--ink-deep),var(--navy) 70%,var(--navy-up));color:var(--on-dark);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em}
.acard-h b{font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:118%;font-size:15px;color:#fff;letter-spacing:.05em}
.acard-b{padding:14px 16px;display:grid;gap:10px;font-size:14px}
.acard dl{margin:0;display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 12px}
.acard dt{color:var(--muted);font-size:13px}
.acard dd{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--ink-deep);color:var(--cyan-soft);border-radius:999px;padding:1px 11px;font-size:13px}

/* 교신(서류 발표) */
.sig{display:grid;justify-items:center;gap:8px;padding:24px 18px;text-align:center;border-radius:var(--r);color:var(--on-dark);background:radial-gradient(90% 100% at 50% 0%, var(--navy-up), var(--navy) 55%, var(--ink-deep))}
.sig .note{color:var(--on-dark-muted)}
.radar{width:120px;height:120px}
.radar circle{fill:none;stroke:rgba(39,185,207,.45);stroke-width:1}
.radar .sweep{fill:url(#swp);transform-origin:60px 60px;animation:spin 3.2s linear infinite}
.radar .blip{fill:var(--cyan);stroke:none;animation:tw 1.6s ease-in-out infinite}
.sig.ready .radar circle:not(.blip){stroke:var(--cyan)}
.res{display:grid;gap:10px}
.resi{display:grid;gap:8px;border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.resi.inv{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box}
.times{display:flex;flex-wrap:wrap;gap:6px}
.time{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:4px 10px;font-family:var(--f-mono);font-size:13px}
.time[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--cyan);color:var(--cyan-soft);box-shadow:0 0 12px -4px var(--cyan)}
.time:disabled{opacity:.4;cursor:not-allowed}
.gate-open{position:relative;height:96px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%, #F2FCFF 0%, var(--cyan-soft) 14%, var(--cyan) 32%, var(--blue) 58%, var(--ink-deep) 100%)}
.gate-open i{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,var(--navy) 0 10px,var(--navy-deep) 10px 12px);animation:doorL 1.1s .25s cubic-bezier(.7,0,.2,1) forwards}
.gate-open i:first-child{left:0;border-right:2px solid var(--cyan)}
.gate-open i:last-child{right:0;border-left:2px solid var(--cyan);animation-name:doorR}
.gate-open b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:122%;font-size:14px;letter-spacing:.24em;color:var(--ink-deep);opacity:0;animation:fadein .5s 1.1s forwards}
@keyframes doorL{to{transform:translateX(-100%)}}
@keyframes doorR{to{transform:translateX(100%)}}
@keyframes fadein{to{opacity:1}}

/* 도킹(박람회) */
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;background:var(--panel);display:grid;gap:6px}
.meter .mv{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;font-size:24px;line-height:1.1}
.meter .mv small{font-family:var(--f-body);font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.meter .mb{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.meter .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.meter.ok{border-color:var(--ok)}
.meter .ml{font-size:12.5px;color:var(--muted)}
.booths{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.booth{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;align-content:start}
.booth.in{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box}
.booth-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.booth-h b{font-size:15px}
.ms{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ms li{display:flex;gap:8px;align-items:center;font-size:13.5px}
.ms .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--lock);display:grid;place-items:center;flex:none;font-size:11px;color:var(--ink-deep);font-weight:800}
.ms li.ok .mk{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px -2px var(--cyan)}
.ms .mbtn,.ms .pinrow{margin-left:auto}
.pinrow{display:flex;gap:6px;align-items:center}
.pinrow input{width:96px;border:1px solid var(--rule);border-radius:8px;padding:5px 8px;font-family:var(--f-mono);letter-spacing:.2em;background:var(--panel)}
.codes{overflow-x:auto}
.codes table{border-collapse:collapse;font-size:13px}
.codes td,.codes th{border-bottom:1px solid var(--rule);padding:4px 12px 4px 0;text-align:left;white-space:nowrap}

/* 출항(오퍼) */
.offer{border-radius:18px;overflow:hidden;max-width:620px;background:var(--panel);border:1px solid var(--rule);box-shadow:0 18px 40px -26px rgba(31,92,196,.8)}
.offer-h{position:relative;overflow:hidden;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:radial-gradient(120% 140% at 100% 0%, var(--navy-up), var(--navy) 55%, var(--ink-deep))}
.offer-h .ok-k{display:grid;line-height:1.2}
.offer-h .ok-k span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--cyan-soft)}
.offer-h .ok-k b{font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:120%;font-size:22px;letter-spacing:.02em}
.seal{width:58px;height:58px;flex:none;animation:spin 40s linear infinite}
.offer-b{padding:14px 18px;display:grid;gap:10px}

/* ── 크루 탑승권(옆) ─────────────── */
.side{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:920px){.side{position:static}}
.ticket{position:relative;overflow:hidden;border-radius:20px;color:var(--on-dark);background:radial-gradient(120% 70% at 92% 0%, var(--navy-up) 0%, var(--navy) 50%, var(--ink-deep) 100%);box-shadow:0 24px 50px -30px rgba(27,36,82,.95)}
.ticket>*{position:relative}
.ticket .stars{position:absolute}
.tk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--on-dark-muted);border-bottom:1px solid var(--on-dark-line)}
.tk-h img{height:20px;width:auto}
.tk-b{padding:14px 16px;display:grid;gap:10px}
.tk-id{font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:120%;font-size:29px;letter-spacing:.04em;line-height:1;color:#fff}
.tk-name{font-size:17px;font-weight:700}
.tk-star{justify-self:start;display:inline-flex;gap:6px;align-items:center;background:var(--cyan);color:var(--ink-deep);border-radius:999px;padding:3px 11px 3px 8px;font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:110%;font-size:12.5px}
.tk-star svg{width:13px;height:13px;fill:var(--ink-deep)}
.tk-star.none{background:transparent;color:var(--on-dark-muted);border:1px dashed var(--on-dark-line)}
.tk-dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.tk-dl dt{color:var(--on-dark-muted)}
.tk-dl dd{margin:0}
.rank{display:grid;gap:6px;border:1px solid var(--on-dark-line);border-radius:12px;padding:10px 12px;background:rgba(11,16,48,.35)}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank-top b{font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:118%;font-size:15px;letter-spacing:.08em;color:var(--amber-soft)}
.rank-top span{font-size:12px;color:var(--on-dark-muted)}
.xpbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-soft));transition:width .6s ease}
.rank small{font-size:11.5px;color:var(--on-dark-muted)}
.perf{position:relative;border-top:2px dashed var(--on-dark-line);margin:2px 14px 0}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.perf::before{left:-25px}
.perf::after{right:-25px}
.ins-h{display:flex;justify-content:space-between;padding:12px 16px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--on-dark-muted)}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 16px 14px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px dashed rgba(169,181,214,.35);display:grid;place-items:center;align-content:center;gap:1px;text-align:center;font-size:9.5px;line-height:1.15;color:var(--on-dark-muted);padding:2px}
.stamp svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6}
.stamp.on{border:1.5px solid var(--c,var(--cyan));color:#fff;background:radial-gradient(circle, rgba(39,185,207,.25), transparent 72%);box-shadow:0 0 14px -3px var(--c,var(--cyan))}
.stamp.on svg{fill:var(--c,var(--cyan));stroke:none}
.tk-f{display:flex;justify-content:space-between;gap:8px;padding:0 16px 13px;font-size:11.5px;color:var(--on-dark-muted)}
.nextc{display:grid;gap:8px}
.nextc .nl{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:118%;font-size:11.5px;letter-spacing:.14em;color:var(--main)}
.sent{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.sent li{display:flex;justify-content:space-between;gap:8px}
.sent li span:last-child{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.sent li.ok span:last-child{color:var(--ok)}

/* 알림·모달·게이트 통과 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink-deep);color:var(--on-dark);border:1px solid rgba(39,185,207,.45);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(11,16,48,.8)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal-c{background:var(--panel);border-radius:18px;max-width:520px;width:100%;padding:22px;display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.modal-c h2{margin:0;font-size:21px}
.modal-c .kick{display:block;margin-bottom:-8px}
.pop{animation:pop .5s ease both}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.clear{position:fixed;left:50%;top:42%;width:0;height:0;z-index:80;pointer-events:none}
.clear .ring{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:3px solid var(--cyan);box-shadow:0 0 40px rgba(39,185,207,.8),inset 0 0 40px rgba(39,185,207,.55);animation:burst 1.5s ease-out forwards}
.clear .ct{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;background:rgba(11,16,48,.94);color:var(--on-dark);border:1px solid rgba(39,185,207,.55);border-radius:16px;padding:12px 22px;animation:rise 2.6s ease forwards;box-shadow:0 0 40px -10px var(--cyan)}
.clear .ct b{display:block;font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:122%;font-size:24px;letter-spacing:.08em;color:var(--cyan)}
.clear .ct span{font-size:13.5px}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%)}12%,80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-62%)}}
@media (prefers-reduced-motion: reduce){
  .pop,.stars circle,.st.now .dot::after,.gbadge::before,.radar .sweep,.radar .blip,.seal,.xpchip.bump,.clear .ring,.guide img,.modal-c .mc{animation:none}
  .clear .pc{animation:fadein .3s forwards}
  .gate-open i{animation-duration:.01s}.gate-open b{animation-delay:0s;animation-duration:.01s}
  .clear .ct{animation-duration:2.4s}
  .fill,.toast,.xpbar i{transition:none}
}
/* 크루 캐릭터 */
@keyframes hover{50%{transform:translateY(-5px)}}
.guide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.guide img{height:108px;width:auto;max-width:none;display:block;filter:drop-shadow(0 10px 12px rgba(27,36,82,.28));animation:hover 4s ease-in-out infinite}
.bubble{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:10px 14px;font-size:14px;max-width:64ch;box-shadow:0 10px 24px -18px rgba(27,36,82,.7)}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:rotate(45deg)}
.bubble .who{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:115%;font-size:11px;letter-spacing:.12em;color:var(--cc,var(--main));text-transform:uppercase;margin-bottom:2px}
@media (max-width:520px){.guide{gap:10px}.guide img{height:84px}.bubble{font-size:13.5px;padding:9px 12px}}
.crew{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.crew{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.crew{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cm{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;text-align:center;border:1px solid var(--rule);border-radius:18px;padding:0 8px 12px;background:var(--panel);overflow:hidden}
.cm .stage{position:relative;width:calc(100% + 16px);height:150px;margin:0 -8px 6px;display:grid;place-items:end center;overflow:hidden;background:radial-gradient(70% 70% at 50% 100%, var(--cc) 0%, transparent 72%),linear-gradient(180deg,var(--ink-deep),var(--navy))}
.cm .stage img{height:138px;width:auto;max-width:none;margin-bottom:4px;transition:transform .25s}
.cm:hover .stage img{transform:translateY(-5px) scale(1.04)}
.cm b{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:108%;font-size:13px;line-height:1.25}
.cm em{font-style:italic;font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:11.5px;color:var(--cc);letter-spacing:.04em;filter:brightness(.8)}
.cm span{font-size:12.5px;color:var(--muted)}
.cm small{font-family:var(--f-mono);font-size:10.5px;color:var(--main);margin-top:2px}
.cm[aria-pressed="true"]{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--blue),var(--cyan)) border-box;box-shadow:0 14px 30px -18px rgba(31,92,196,.9)}
.cm[aria-pressed="true"] .stage::after{content:"MY STAR";position:absolute;top:8px;right:8px;background:var(--cyan);color:var(--ink-deep);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:10px;letter-spacing:.08em;border-radius:999px;padding:2px 8px}
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tk-top>div{display:grid;gap:8px;min-width:0}
.port{width:74px;height:74px;flex:none;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 70%, var(--cc,#27B9CF) 0%, rgba(11,16,48,.25) 72%);box-shadow:0 0 0 2px rgba(191,239,246,.55),0 0 20px -4px var(--cc,#27B9CF)}
.port img{width:100%;height:100%;display:block}
.port.none{display:grid;place-items:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(169,181,214,.4)}
.port.none svg{width:26px;height:26px;fill:none;stroke:var(--on-dark-muted);stroke-width:1.4}
.clear .pc{position:absolute;left:0;top:-222px;height:200px;width:auto;max-width:none;translate:-50% 0;filter:drop-shadow(0 0 22px rgba(39,185,207,.75));animation:jump 2.6s ease forwards}
@keyframes jump{0%{opacity:0;transform:translateY(40px) scale(.55)}22%{opacity:1;transform:translateY(-14px) scale(1.06)}34%{transform:translateY(0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.homebtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--on-dark-line);background:transparent;color:var(--on-dark);font-size:12.5px}
.homebtn svg{width:16px;height:16px}
.homebtn[aria-current="page"]{background:rgba(39,185,207,.16);border-color:rgba(39,185,207,.55);color:var(--cyan-soft)}
.homebtn:hover{border-color:var(--cyan)}
button.brand{background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit}
@media (max-width:560px){.homebtn span{display:none}.homebtn{padding:0 8px}}
details.edit{border:1px solid var(--rule);border-radius:var(--r);background:var(--panel)}
details.edit>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.edit>summary::-webkit-details-marker{display:none}
details.edit>summary::after{content:"＋";color:var(--muted)}
details.edit[open]>summary::after{content:"－"}
details.edit>form{border:0;border-top:1px solid var(--rule);border-radius:0 0 var(--r) var(--r)}
.cheer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.cheer img{height:120px;width:auto;max-width:none}
.modal-c .mc{position:absolute;right:14px;top:-58px;height:130px;width:auto;max-width:none;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));animation:jump2 1.4s .9s ease both}
@keyframes jump2{0%{opacity:0;transform:translateY(30px) scale(.7)}50%{opacity:1;transform:translateY(-8px) scale(1.04)}100%{opacity:1;transform:none}}
.modal-c{position:relative;overflow:visible}
.empty{border:1px dashed var(--rule);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;margin:0}
</style>
</head>

const starFlags = r => [clipDone(r.clips[0].id), clipDone(r.clips[1].id), len(S.notes[r.id]) >= 50];

function caseBlock(t) {

/* R5 서류발표: 교신 */

}
function vResult() {

  const open = resultOpen(), res = myRes();
  let out = `${head('result')}

    <div class="row"><button class="fbtn" type="button" data-act="consent" data-v="yes" aria-pressed="${S.consentB === true}">동의합니다</button><button class="fbtn" type="button" data-act="consent" data-v="no" aria-pressed="${S.consentB === false}">동의하지 않습니다</button></div>
  </div>`;
  if (!open) {
    out += `<div class="sig">${radar(false)}<span class="kick" style="color:var(--cyan)">Awaiting signal</span><strong>1.5(화) 09:00 교신 예정</strong><p class="note">앵커기업이 지원 카드를 검토하고 있어요.</p></div>`;
    return out;
  }
  if (!S.seen) {
    out += `<div class="sig ready">${radar(true)}<span class="kick" style="color:var(--cyan)">Signal incoming</span><strong>앵커기업에서 서류 결과 신호가 도착했어요</strong><button class="btn" type="button" data-act="reveal" style="background:var(--cyan);color:var(--ink-deep)">${ICON.signal} 신호 열기</button></div>`;
    return out;
  }

  out += `<div class="sec"><h2>서류 결과</h2><div class="res">${S.apps.map(id => {
    const p = PMAP[id], isInv = inv.includes(id);
    if (isInv) return `<div class="resi inv"><div class="row"><span class="chip now">면접 초대</span><strong>${esc(CO[p.co].name)} · ${esc(p.title)}</strong></div><p class="note" style="margin:0">2일차 1.7(목) 1:1 모의면접 시간을 골라 주세요 (20분)</p><div class="times">${TIMES.map(t => `<button class="time" type="button" data-act="slot" data-id="${id}" data-t="${t}" aria-pressed="${S.slots[id] === t}"${taken(id).includes(t) ? ' disabled' : ''}>${t}</button>`).join('')}</div></div>`;
    return `<div class="resi"><div class="row"><span class="chip">${openList.includes(id) ? '열린 면접' : '결과 대기'}</span><strong>${esc(CO[p.co].name)} · ${esc(p.title)}</strong></div><p class="note" style="margin:0">${openList.includes(id) ? '박람회 투어 시간에 부스의 열린 면접 줄에 서면 같은 면접을 볼 수 있어요. 서류 피드백도 받을 수 있습니다.' : '아직 결과가 오지 않았어요.'}</p></div>`;
  }).join('')}</div></div>`;
  return out;
}

  <div class="meters">${m(fs.n, 5, '①② 마친 스테이션')}${m(fs.pharma, 2, '제약·바이오')}${m(fs.device, 2, '의료기기')}${m(fs.extra, 2, '③~⑤ 미션')}</div>
  <div class="box row"><label class="f" style="flex:1;min-width:180px"><span>부스 코드 <em>(QR이 안 될 때)</em></span><input id="boothCode" placeholder="예: CK27" autocomplete="off"></label><button class="btn" type="button" data-act="checkin" style="align-self:end">도킹(체크인)</button></div>
  ${S.demo ? `<div class="box codes"><h2 style="margin:0 0 8px;font-size:15px">시연용 코드</h2><table><tr><th>부스</th><th>부스 코드</th><th>담당자 확인 번호</th></tr>${BOOTHS.map(b => `<tr><td>${esc(b.name)}</td><td class="num">${b.code}</td><td class="num">${b.pin}</td></tr>`).join('')}</table></div>` : ''}
  ${['pharma', 'device', 'path'].map(z => `<div class="sec"><h2>${ZONE[z]}</h2><div class="booths">${BOOTHS.filter(b => b.zone === z).map(boothCard).join('')}</div></div>`).join('')}
  <div class="row"><button class="btn" type="button" data-act="send-fair">${S.sent.S6 ? '미션 기록 다시 보내기' : '미션 기록 보내기'}</button><span class="note">기준을 채운 뒤 보내 주세요.</span></div>`;
}
function slotLine(co) { const ids = S.apps.filter(id => PMAP[id].co === co && S.slots[id]); return ids.length ? `<span class="chip now">면접 1.7 ${ids.map(id => S.slots[id]).join(', ')}</span>` : ''; }
function boothCard(b) {
  const f = S.fair[b.id] || {}, m = f.m || [];
  const items = MISSIONS.map((name, i) => {
    let ctrl = '';
    if (!m[i]) {
      if (!f.in) ctrl = '';
      else if (i === 0) ctrl = '';
      else if (UI.pin && UI.pin.b === b.id && UI.pin.m === i) ctrl = `<span class="pinrow"><input id="pin-${b.id}" inputmode="numeric" maxlength="4" placeholder="번호" aria-label="담당자 확인 번호"><button class="btn sm" type="button" data-act="pin-ok" data-b="${b.id}" data-m="${i}">확인</button></span>`;
      else ctrl = `<button class="btn ghost sm mbtn" type="button" data-act="pin-open" data-b="${b.id}" data-m="${i}">담당자 확인</button>`;
    }
    return `<li class="${m[i] ? 'ok' : ''}"><span class="mk">${m[i] ? '✓' : ''}</span><span>${'①②③④⑤'[i]} ${name}</span>${ctrl}</li>`;
  }).join('');
  return `<div class="booth${f.in ? ' in' : ''}"><div class="booth-h"><b>${esc(b.name)}</b>${f.in ? `<span class="chip ok">도킹 ${esc(f.in)}</span>` : '<span class="chip lock">도킹 전</span>'}</div>${slotLine(b.id)}
    <ul class="ms">${items}</ul>
    ${f.in ? `<label class="f"><span>브리핑 핵심 3줄 <em>(선택 · 성찰일지 재료)</em></span>${ta(`fair.${b.id}.note`, 3, '회사·직무에서 새로 안 것')}${counter(`fair.${b.id}.note`, 20)}</label>` : ''}
  </div>`;
}

function genId() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return 'UA27-' + s; }
function showMsg(id, text) { const el = $('#' + id); if (!el) { toast(text); return; } el.textContent = text; el.hidden = !text; }

document.addEventListener('submit', e => {
  if (e.target.id !== 'boardForm') return;
  e.preventDefault();
  const fd = new FormData(e.target), v = k => String(fd.get(k) || '').trim();
  const miss = ['name', 'univ', 'sid', 'major', 'grade', 'track'].filter(k => !v(k));
  if (miss.length) return showMsg('boardMsg', '빈 칸을 모두 채워 주세요.');
  if (!fd.get('consent')) return showMsg('boardMsg', '개인정보 수집·이용에 동의해야 과제를 제출할 수 있어요.');
  const old = S.profile || {};
  S.profile = { id: old.id || genId(), name: v('name'), univ: v('univ'), sid: v('sid'), major: v('major'), grade: v('grade'), track: v('track'), star: v('star'), consent: true, sample: old.sample || false };
  save(); toast(old.id ? '탑승권을 고쳤어요.' : `탑승권이 발급됐어요 · 크루 ${S.profile.id}`); if (old.id) { UI.editTicket = false; go('board'); } else go('explore');
});

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { const id = g.dataset.go; go(id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'demo') { S.demo = !S.demo; save(); toast(S.demo ? '시연 모드를 켰어요.' : '시연 모드를 껐어요.'); render(); return; }
  if (act === 'sample') { fillSample(); go('result'); toast('예시 크루로 채웠어요. 시연 모드가 켜졌습니다.'); return; }
  if (act === 'pickstar') {
    const v = a.getAttribute('aria-pressed') === 'true' ? '' : a.dataset.v;
    document.querySelectorAll('.cm').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    const sel = $('#b-star'); if (sel) sel.value = v;
    if (S.profile) { S.profile.star = v; save(); renderSide(); } else UI.star = v;
    toast(v ? `${STARS[v].en} STAR · ${CREWS[CREW_OF[v]].ko} 크루와 함께 탑승해요.` : 'STAR 유형 선택을 풀었어요.'); return;
  }
  if (act === 'to-form') { const f = $('#boardForm'); if (f) { f.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); setTimeout(() => { const n = $('#b-name'); if (n) n.focus({ preventScroll: true }); }, RM ? 0 : 400); } return; }
  if (act === 'edit-ticket') { UI.editTicket = true; if (VIEW !== 'board') go('board'); else render(); setTimeout(() => { const f = $('#editBox'); if (f) { f.open = true; f.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); } }, 60); return; }
  if (act === 'edit-crew') { if (VIEW !== 'board') go('board'); setTimeout(() => { const c = $('.crew'); if (c) c.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' }); }, 60); return; }
  if (act === 'stop') { UI.stop = UI.stop === id ? null : id; render(); const el = $('.editor textarea, .editor input:not([type=checkbox])'); if (el) el.focus({ preventScroll: false }); return; }
  if (act === 'filter') { UI.filter = a.dataset.v; render(); return; }
  if (act === 'detail') { UI.open[id] = !UI.open[id]; render(); return; }
  if (act === 'apply') {
    if (S.apps.length >= 3) { toast('슬롯 세 개를 모두 썼어요. 하나를 취소한 뒤 다시 지원하세요.'); return; }
    S.apps.push(id); save(); toast(`${CO[PMAP[id].co].name} ${PMAP[id].title}에 지원했어요.`); render(); return;
  }

  if (act === 'sub-resume') {
    if (!resumeOk()) return showMsg('msg-resume', 'EXP 1의 세 칸과 강점 키워드 두 개 이상을 채워 주세요.');
    S.sub.resume = true; save();
    const r = S.resume;
    await send('S3 서류전형(이력서)', '', `강점: ${r.strengths.filter(Boolean).join(', ')}\n${r.exp.map((x, i) => x.what ? `EXP${i + 1} ${x.what} / ${x.role || ''} / ${x.result || ''}` : '').filter(Boolean).join('\n')}\n교육·자격: ${r.edu}\n기술: ${r.skills}\n①이수: ${r.c1 ? '예' : '아니오'}`);
    toast('이력서를 제출했어요.'); UI.doc = S.apps.find(x => !S.sub[x]) || 'resume'; render(); return;

  if (act === 'sub-essay') {

    if ((S.checks[id] || []).filter(Boolean).length < 5) return showMsg('msg-essay', '자가점검 다섯 항목을 모두 확인해 주세요.');

    await send('S3 서류전형(자기소개서)', `${CO[p.co].name} ${p.title}`, `1. ${e2[0]}\n\n2. ${e2[1]}`);
    toast('자기소개서를 제출했어요.'); UI.doc = S.apps.find(x => !S.sub[x]) || (S.sub.resume ? id : 'resume'); render(); return;

    if (missing) return showMsg('msg-case-' + t, '객관식 문항을 모두 골라 주세요.');

    await send('S4 직무과제·면접준비', '', `${ts.map(t => `${t} ${S.cases[t].score}/${CASES[t].qs.length} — ${S.cases[t].open}`).join('\n')}\n\n1분 자기소개: ${S.iv.intro}\n질문: ${S.iv.ask}`);

  }
